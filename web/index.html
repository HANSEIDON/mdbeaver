<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mdbeaver — documents to AI-ready Markdown</title>
  <meta name="description" content="Turn PDFs, Word files and slides into lean, AI-ready Markdown. Tables, formulas, Korean, Chinese and English.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/vendor/jszip.min.js" defer></script>
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/" aria-label="mdbeaver home">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="15" class="logo-face"/>
        <circle cx="7" cy="7" r="3.2" class="logo-face"/><circle cx="25" cy="7" r="3.2" class="logo-face"/>
        <circle cx="11" cy="13" r="2" class="logo-eye"/><circle cx="21" cy="13" r="2" class="logo-eye"/>
        <ellipse cx="16" cy="18" rx="4.5" ry="3" class="logo-nose"/>
        <rect x="13.2" y="20.5" width="2.6" height="5" rx="0.7" class="logo-tooth"/>
        <rect x="16.2" y="20.5" width="2.6" height="5" rx="0.7" class="logo-tooth"/>
      </svg>
      <span class="wordmark">mdbeaver</span>
    </a>
    <nav class="nav">
      <span id="status" class="status" data-state="unknown"><span class="dot"></span><span id="status-text">CHECKING</span></span>
      <a href="/about.html">About</a>
      <a href="https://github.com/HANSEIDON/mdbeaver" target="_blank" rel="noopener">GitHub</a>
    </nav>
  </header>

  <main class="split">
    <section class="pane source" aria-label="Files">
      <p class="label">Upload</p>
      <div id="drop" class="drop" tabindex="0" role="button" aria-label="Add documents">
        <svg class="drop-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg>
        <p class="drop-title">Drag files here</p>
        <span class="btn">Browse files</span>
        <input id="file" type="file" multiple accept=".pdf,.docx,.pptx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.presentationml.presentation" hidden>
      </div>
      <p class="formats">PDF, DOCX, PPTX · up to 50 MB each · deleted after conversion</p>

      <p class="label files-label">Files</p>
      <table class="files">
        <thead><tr><th scope="col">Name</th><th scope="col" class="num">Size</th><th scope="col" class="num">Status</th><th scope="col"><span class="sr">Remove</span></th></tr></thead>
        <tbody id="files"></tbody>
      </table>
      <p id="no-files" class="no-files">No files yet.</p>
    </section>

    <section class="pane panel" aria-label="Conversion">
      <nav class="tabs" role="tablist">
        <button class="tab on" data-tab="config" role="tab">Settings</button>
        <button class="tab" data-tab="results" role="tab">Results</button>
      </nav>

      <div id="tab-config" class="tab-body">
        <div class="group">
          <p class="label" id="mode-label">Mode</p>
          <div class="seg" role="radiogroup" aria-labelledby="mode-label">
            <label><input type="radio" name="mode" value="standard" checked><span><strong>Standard</strong><small>fast</small></span></label>
            <label><input type="radio" name="mode" value="best"><span><strong>Best quality</strong><small>≤50 pages</small></span></label>
            <label><input type="radio" name="mode" value="device"><span><strong>Device only</strong><small>no upload</small></span></label>
          </div>
          <p id="mode-help" class="help"></p>
        </div>

        <div class="group">
          <p class="label">Output</p>
          <label class="check">
            <input id="keep-pages" type="checkbox">
            <span>Keep page numbers<small>Adds <code>[p.12]</code> so the AI can cite pages</small></span>
          </label>
        </div>
      </div>

      <div id="tab-results" class="tab-body results" hidden>
        <div id="empty" class="empty">
          <p>Nothing here yet.</p>
          <small>Add files and press Convert.</small>
        </div>
        <div id="result" class="result" hidden>
          <div class="result-bar">
            <p id="result-stats" class="result-stats"></p>
            <div class="actions">
              <button id="copy" class="btn primary">Copy</button>
              <button id="download" class="btn">.md</button>
              <button id="download-zip" class="btn" hidden>.zip</button>
            </div>
          </div>
          <p id="result-name" class="sr"></p>
          <textarea id="output" readonly spellcheck="false" aria-label="Markdown output"></textarea>
        </div>
      </div>

      <div id="working" class="working" hidden>
        <svg class="mini-beaver" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="15" class="logo-face"/>
          <circle cx="11" cy="13" r="2" class="logo-eye"/><circle cx="21" cy="13" r="2" class="logo-eye"/>
          <ellipse cx="16" cy="18" rx="4.5" ry="3" class="logo-nose"/>
          <g class="teeth"><rect x="13.2" y="20.5" width="2.6" height="5" rx="0.7" class="logo-tooth"/><rect x="16.2" y="20.5" width="2.6" height="5" rx="0.7" class="logo-tooth"/></g>
        </svg>
        <span id="working-text" class="working-text"></span>
      </div>

      <div class="dock">
        <div class="dock-info">
          <p id="route" class="route"></p>
          <p id="message" class="message" hidden></p>
        </div>
        <button id="stop" class="btn stop" hidden>Stop</button>
        <button id="run" class="btn run" disabled>Convert</button>
      </div>
    </section>
  </main>
</body>
</html>
