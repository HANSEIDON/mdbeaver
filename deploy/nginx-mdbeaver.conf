limit_req_zone $binary_remote_addr zone=mdb_jobs:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=mdb_api:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name mdbeaver.com www.mdbeaver.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://mdbeaver.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.mdbeaver.com;
    ssl_certificate /etc/letsencrypt/live/mdbeaver.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mdbeaver.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://mdbeaver.com$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name mdbeaver.com;
    ssl_certificate /etc/letsencrypt/live/mdbeaver.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mdbeaver.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/mdbeaver;
    index index.html;
    client_max_body_size 201m;  # 50 MB normally; coupons allow up to 200 (the gateway enforces each)

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Pages, styles, scripts and art change with every deploy: browsers must revalidate them
    # (a cheap 304 when unchanged) instead of guessing a cache lifetime and mixing old and new.
    # `expires` is used rather than add_header so the security headers above still apply here.
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    location /vendor/ {
        types { text/javascript js mjs; }
        expires 7d;
    }
    location /js/ {
        types { text/javascript js mjs; }
        expires -1;
    }

    location = /api/jobs {
        limit_req zone=mdb_jobs burst=5 nodelay;
        limit_req_status 429;
        proxy_request_buffering on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8000;
    }

    location /api/worker/ {
        client_max_body_size 25m;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:8000;
    }

    location /api/ {
        limit_req zone=mdb_api burst=20 nodelay;
        limit_req_status 429;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:8000;
    }
}
